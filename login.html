<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPINIX MANIA | My Account</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f2ff;color:#211044;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:white;width:100%;max-width:440px;padding:35px;border-radius:22px;box-shadow:0 12px 40px #32105e18}
.brand{text-align:center;font-size:25px;font-weight:900;letter-spacing:2px;margin-bottom:12px}
.brand span{color:#e34899}
h1{text-align:center;font-size:27px;margin:18px 0 8px}
p{text-align:center;color:#71657f;line-height:1.6}
label{display:block;font-weight:bold;margin:18px 0 8px}
input{width:100%;padding:14px;border:1px solid #ddd3eb;border-radius:10px;font-size:15px}
button{width:100%;padding:15px;border:0;border-radius:30px;background:linear-gradient(100deg,#6d28d9,#e34899);color:white;font-weight:bold;font-size:16px;margin-top:18px;cursor:pointer}
.note{text-align:center;font-size:12px;margin-top:20px}
a{color:#7625bd}
</style>
</head>
<body>
<div class="card">
<div class="brand">✦ SPINIX <span>MANIA</span></div>
<h1>Welcome to SPINIX</h1>
<p>Your personal space for your SPINIX experience.</p>
<form>
<label>Email address</label>
<input type="email" placeholder="Enter your email" required>
<label>Password</label>
<input type="password" placeholder="Enter your password" required>
<button type="button">Sign In</button>
<button type="button">Create Account</button>
</form>
<p class="note">Account services will be activated after secure connection and testing.</p>
</div>
</body>
</html>
