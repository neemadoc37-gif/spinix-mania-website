<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPINIX MANIA | My Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f7f2ff;color:#211044;
 min-height:100vh;display:grid;place-items:center;padding:20px
}
.card{
 background:white;width:100%;max-width:440px;
 padding:35px;border-radius:22px;
 box-shadow:0 12px 40px #32105e18
}
.brand{text-align:center;font-size:25px;font-weight:900;
 letter-spacing:2px;margin-bottom:12px}
.brand span{color:#e34899}
h1{text-align:center;font-size:27px;margin:18px 0 8px}
p{text-align:center;color:#71657f;line-height:1.6}
label{display:block;font-weight:bold;margin:18px 0 8px}
input{
 width:100%;padding:14px;border:1px solid #ddd3eb;
 border-radius:10px;font-size:15px
}
button{
 width:100%;padding:15px;border:0;border-radius:30px;
 background:linear-gradient(100deg,#6d28d9,#e34899);
 color:white;font-weight:bold;font-size:16px;
 margin-top:18px;cursor:pointer
}
.secondary{background:#eee7f8;color:#54218a}
.note{text-align:center;font-size:12px;margin-top:20px}
a{color:#7625bd;cursor:pointer}
#message{font-size:14px;text-align:center;margin-top:16px}
.hidden{display:none}
</style>
</head>

<body>
<div class="card">

<div class="brand">✦ SPINIX <span>MANIA</span></div>

<h1 id="heading">Welcome to SPINIX</h1>
<p>Your personal space for your SPINIX experience.</p>

<form id="authForm">

<label>Email address</label>
<input id="email" type="email"
 placeholder="Enter your email" autocomplete="email" required>

<label>Password</label>
<input id="password" type="password"
 placeholder="Enter your password"
 autocomplete="current-password" minlength="8" required>

<button id="submitBtn" type="submit">Sign In</button>

<button id="switchBtn" class="secondary" type="button">
Create Account
</button>

</form>

<p id="forgotArea"><a id="forgotBtn">Forgot password?</a></p>

<div id="message" role="status" aria-live="polite"></div>

<p class="note">
Use a valid email address. New accounts must verify their email.
</p>

</div>

<script>
const SUPABASE_URL =
"https://lkhkbsquoghfdlfcunwx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uYsqtYSHMXvQ4wcudxbMng_Ifps-jS7";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const form = document.getElementById("authForm");
const heading = document.getElementById("heading");
const submitBtn = document.getElementById("submitBtn");
const switchBtn = document.getElementById("switchBtn");
const password = document.getElementById("password");
const email = document.getElementById("email");
const message = document.getElementById("message");
const forgotArea = document.getElementById("forgotArea");

let mode = "login";

function showMessage(text, error = false) {
 message.textContent = text;
 message.style.color = error ? "#c62828" : "#248047";
}

function setMode(newMode) {
 mode = newMode;
 message.textContent = "";

 if(mode === "login") {
  heading.textContent = "Welcome to SPINIX";
  submitBtn.textContent = "Sign In";
  switchBtn.textContent = "Create Account";
  password.autocomplete = "current-password";
  forgotArea.classList.remove("hidden");
 } else {
  heading.textContent = "Create Your Account";
  submitBtn.textContent = "Register";
  switchBtn.textContent = "Already have an account? Sign In";
  password.autocomplete = "new-password";
  forgotArea.classList.add("hidden");
 }
}

switchBtn.addEventListener("click", () => {
 setMode(mode === "login" ? "signup" : "login");
});

form.addEventListener("submit", async (event) => {
 event.preventDefault();

 const userEmail = email.value.trim();
 const userPassword = password.value;

 submitBtn.disabled = true;
 showMessage("Please wait...");

 try {

  if(mode === "signup") {

   const {data, error} = await db.auth.signUp({
    email: userEmail,
    password: userPassword,
    options: {
     emailRedirectTo: window.location.href
    }
   });

   if(error) throw error;

   if(data.session) {
    showMessage("Account created successfully!");
    window.location.href = new URL(
     "account.html", window.location.href
    ).href;
   } else {
    showMessage(
     "Registration successful! Please check your email and click the verification link before signing in."
    );
    setMode("login");
   }

  } else {

   const {data, error} = await db.auth.signInWithPassword({
    email: userEmail,
    password: userPassword
   });

   if(error) throw error;

   showMessage("Login successful! Welcome to SPINIX.");

   window.location.href = new URL(
    "account.html", window.location.href
   ).href;
  }

 } catch(error) {
  showMessage(error.message, true);
 } finally {
  submitBtn.disabled = false;
 }
});

document.getElementById("forgotBtn").addEventListener("click",
 async () => {

 const userEmail = email.value.trim();

 if(!userEmail) {
  showMessage("Enter your email address first.", true);
  email.focus();
  return;
 }

 try {
  const {error} = await db.auth.resetPasswordForEmail(
   userEmail,
   {redirectTo: window.location.href}
  );

  if(error) throw error;

  showMessage("Password reset instructions have been sent to your email.");

 } catch(error) {
  showMessage(error.message, true);
 }
});
</script>

</body>
</html>
